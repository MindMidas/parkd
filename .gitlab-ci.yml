image: ghcr.io/cirruslabs/flutter:3.41.5

stages:
  - analyze
  - test
  - build

variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .pub-cache/
    - .dart_tool/

before_script:
  - flutter --version
  - flutter pub get

analyze:
  stage: analyze
  script:
    - dart format --output=none --set-exit-if-changed lib test integration_test supabase/functions
    - flutter analyze
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

test:
  stage: test
  script:
    - flutter test --coverage
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

build_web:
  stage: build
  script:
    - flutter build web --no-pub --release --dart-define=PARKD_DEMO=true --dart-define=SUPABASE_URL=https://example.supabase.co --dart-define=SUPABASE_ANON_KEY=ci-public-placeholder --dart-define=MAPBOX_ACCESS_TOKEN=ci-public-placeholder --dart-define=STRIPE_PUBLISHABLE_KEY=pk_test_ci_placeholder --dart-define=TURNSTILE_SITE_KEY=1x00000000000000000000AA
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
