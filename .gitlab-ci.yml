image: ghcr.io/cirruslabs/flutter:stable

stages:
  - analyze
  - test

variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .pub-cache/
    - .dart_tool/

before_script:
  - flutter --version
  - flutter pub get

analyze:
  stage: analyze
  script:
    - flutter analyze
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

test:
  stage: test
  script:
    - flutter test --reporter expanded
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
