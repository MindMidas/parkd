image: ghcr.io/cirruslabs/flutter:stable

stages:
  - analyze
  - build

variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .pub-cache/
    - .dart_tool/

before_script:
  - flutter --version
  - if [ ! -f .env ]; then cp .env.example .env; fi
  - flutter pub get

analyze:
  stage: analyze
  script:
    - flutter analyze
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# No unit tests in repo; this compile smoke catches broken imports / missing assets / web issues analyze can miss
build_web:
  stage: build
  script:
    - flutter build web --no-pub --release
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
