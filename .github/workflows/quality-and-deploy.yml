name: Quality and Vercel deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parkd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.5
  VERCEL_CLI_VERSION: 56.4.0

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Keep retired Firebase clients out of the release tree
        shell: bash
        run: |
          test ! -e android/app/google-services.json
          test ! -e ios/Runner/GoogleService-Info.plist
      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  edge-functions:
    name: Supabase Edge Function checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.4.5

      - name: Check Edge Function formatting
        working-directory: supabase/functions
        run: deno fmt --check

      - name: Type-check and lint Edge Functions
        working-directory: supabase/functions
        run: |
          deno lint
          deno task check

      - name: Run hermetic Edge Function tests
        working-directory: supabase/functions
        run: deno task test

  database-security:
    name: Supabase RLS and database contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v1
        with:
          version: 2.75.0

      - name: Start isolated local database
        run: >-
          supabase start -x
          gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Lint database schema
        run: supabase db lint --local --level error --fail-on error

      - name: Run pgTAP RLS and security contracts
        run: supabase test db

      - name: Stop local database
        if: always()
        run: supabase stop --no-backup

  quality:
    name: Flutter quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Report toolchain
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test supabase/functions

      - name: Analyze
        run: flutter analyze

      - name: Run unit and widget tests with coverage
        run: flutter test test --coverage --test-randomize-ordering-seed=20260720

      - name: Enforce global coverage ratchet
        run: dart run .github/scripts/check_coverage.dart coverage/lcov.info 13.0 90.0

      - name: Build offline Flutter showcase
        run: >-
          flutter build web --release
          --dart-define=PARKD_SHOWCASE=true
          --dart-define=PARKD_DEMO=true

      - name: Upload deployable web artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parkd-web-${{ github.sha }}
          path: build/web
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy production demo to Vercel
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [secret-scan, edge-functions, database-security, quality]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download tested web artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: parkd-web-${{ github.sha }}
          path: build/web

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Link Vercel project
        run: npx --yes vercel@${VERCEL_CLI_VERSION} pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Assemble Vercel prebuilt output
        shell: bash
        run: |
          mkdir -p .vercel/output/static
          cp -R build/web/. .vercel/output/static/
          cp .github/vercel/output-config.json .vercel/output/config.json

      - name: Deploy tested prebuilt artifact
        id: deploy
        shell: bash
        run: |
          url="$(npx --yes vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $url"
