# Production application quality gates.
name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parkd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.5

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Keep retired Firebase clients out of the release tree
        shell: bash
        run: |
          test ! -e android/app/google-services.json
          test ! -e ios/Runner/GoogleService-Info.plist
      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  edge-functions:
    name: Supabase Edge Function checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.4.5

      - name: Check Edge Function formatting
        working-directory: supabase/functions
        run: deno fmt --check

      - name: Type-check and lint Edge Functions
        working-directory: supabase/functions
        run: |
          deno lint
          deno task check

      - name: Run hermetic Edge Function tests
        working-directory: supabase/functions
        run: deno task test

  database-security:
    name: Supabase RLS and database contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.75.0

      - name: Start isolated local database
        run: >-
          supabase start -x
          gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Lint database schema
        run: supabase db lint --local --level error --fail-on error

      - name: Run pgTAP RLS and security contracts
        run: supabase test db

      - name: Stop local database
        if: always()
        run: supabase stop --no-backup

  quality:
    name: Flutter quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Report toolchain
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test supabase/functions

      - name: Analyze
        run: flutter analyze

      - name: Run unit and widget tests with coverage
        run: flutter test test --coverage --test-randomize-ordering-seed=20260720

      - name: Enforce global coverage ratchet
        run: dart run .github/scripts/check_coverage.dart coverage/lcov.info 13.0 90.0

      - name: Build Flutter web release
        run: flutter build web --release

      - name: Upload deployable web artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parkd-web-${{ github.sha }}
          path: build/web
          if-no-files-found: error
          retention-days: 7
