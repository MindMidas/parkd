name: parkd
description: Parkd parking app (CIS*4030).
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.2.1
  go_router: ^17.1.0
  supabase_flutter: ^2.12.0
  flutter_secure_storage: ^10.0.0
  geolocator: ^14.0.2
  image_picker: ^1.2.1
  intl: ^0.20.2
  google_fonts: ^8.0.2
  flutter_dotenv: ^5.2.1
  http: ^1.2.1
  http_parser: ^4.1.2
  url_launcher: ^6.2.5
  package_info_plus: ^9.0.0
  intl_phone_field: ^3.2.0
  flutter_svg: ^2.2.4
  shared_preferences: ^2.5.4
  mapbox_maps_flutter: ^2.20.1
  flutter_stripe: ^11.3.0
  image_cropper: ^12.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - lib/core/assets/login_house.jpg
    - lib/core/assets/logo.png
    - lib/core/assets/map_pin.png
    - lib/core/assets/map_pin_draft.png

# dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: lib/core/assets/logo.png
  image_path_ios: lib/core/assets/logo_launcher_ios.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: lib/core/assets/logo.png
  adaptive_icon_foreground_inset: 30
  remove_alpha_ios: true
