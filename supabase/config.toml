# Authenticated functions use both gateway verification and auth.getUser() in the
# handler. The Stripe webhook is the sole public endpoint and verifies Stripe's
# signature against the raw request body.
[functions.create-setup-intent]
verify_jwt = true

[functions.complete-payment-method-setup]
verify_jwt = true

[functions.create-payment-intent]
verify_jwt = true

[functions.finalize-reservation-payment]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.geocode-search]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false

[functions.reconcile-account-deletions]
verify_jwt = false
